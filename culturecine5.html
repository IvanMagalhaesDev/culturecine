    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"> <!-- AOS CSS -->
    <style>
        body {
            background-color: #0F171E;
            color: white;
        }
        .navbar-dark .navbar-nav .nav-link {
            color: rgba(255,255,255,.75);
        }
        .navbar-dark .navbar-nav .nav-link.active {
            color: #007bff;
        }
        .highlight img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }
        .section-title {
            font-size: 1.5rem;
            margin: 20px 0;
        }
        .card {
            background-color: #1A242F;
            border: none;
            margin-bottom: 15px;
            transition: transform 0.3s ease; /* Adiciona transição para o efeito de profundidade */
        }
        .card:hover {
            transform: translateY(-10px); /* Efeito de profundidade ao passar o mouse */
        }
        .card img {
            width: 100%;
            height: 170px; /* Altura consistente para todas as imagens */
            object-fit: cover;
            border-radius: 8px;
        }
        .card .live-image {
            object-position: top; /* Ajusta a posição da imagem para cima */
        }
        .prime-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px;
            font-size: 0.8rem;
            color: white;
            border-radius: 4px;
        }
        .cine-tag, .original-tag {
            background-color: #00A8E1; /* Azul */
        }
        .live-tag {
            background-color: #FF007F; /* Rosa choque próximo ao vermelho */
        }
    </style>
</head>
